services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: voc
      POSTGRES_PASSWORD: voc
      POSTGRES_DB: voc
    ports:
      - '5432:5432'
    volumes:
      - voc_postgres_data:/var/lib/postgresql/data

volumes:
  voc_postgres_data:
